name: release-please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The steps below run only on the push that merges a release PR,
      # i.e. when release-please has just created the tag + GitHub Release.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-java@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        if: ${{ steps.release.outputs.release_created }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Attach APK to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "volume-skip-${TAG}.apk"
          gh release upload "${TAG}" "volume-skip-${TAG}.apk" --clobber
